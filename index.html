<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบข้อมูลบริหารจัดการขยะ</title>
<!--
  ฝังเว็บแอป Apps Script ไว้ในหน้านี้ ลิงก์ในแถบที่อยู่จึงยังเป็นของ GitHub Pages
  >>> แก้เฉพาะบรรทัด APP_URL ด้านล่าง: ใส่ Web app URL (ลงท้าย /exec) <<<
  ถ้าแอปแสดงผลไม่ปกติเมื่อถูกฝัง (เช่นบน Safari/iPhone) ให้เปลี่ยน MODE เป็น "redirect" เพื่อใช้แบบเด้งไปที่แอปแทน
-->
<style>
  html,body{height:100%;margin:0}
  iframe{border:0;width:100%;height:100%;display:block}
  #msg{font-family:system-ui,"Noto Sans Thai",sans-serif;display:none;place-items:center;height:100%;text-align:center;padding:16px;color:#1f3d2b}
  a{color:#1b6b3a;font-weight:600}
</style>
</head>
<body>
<iframe id="app" title="ระบบข้อมูลบริหารจัดการขยะ" allow="clipboard-write; fullscreen"></iframe>
<div id="msg"><div><h1>ระบบข้อมูลบริหารจัดการขยะ</h1><p>ยังไม่ได้ตั้งค่าลิงก์แอป — แก้บรรทัด APP_URL ในไฟล์ docs/index.html</p></div></div>
<script>
  var APP_URL = "https://script.google.com/macros/s/AKfycbxWzQ9FGMjN3g4sRTTiUq50l_ZCKnKOsZxhVJ09jYgjrqexuLrziqc9-IJljHlTImRI/exec";
  var MODE = "iframe";   // "iframe" = ลิงก์คงเป็นของ GitHub · "redirect" = เด้งไปลิงก์ของ Apps Script
  var ok = APP_URL.indexOf("https://script.google.com/") === 0;
  var url = APP_URL + (location.search ? (APP_URL.indexOf("?") === -1 ? location.search : "&" + location.search.slice(1)) : "");
  if (!ok) {
    document.getElementById("app").style.display = "none";
    document.getElementById("msg").style.display = "grid";
  } else if (MODE === "redirect") {
    location.replace(url);
  } else {
    document.getElementById("app").src = url;
  }
</script>
</body>
</html>
